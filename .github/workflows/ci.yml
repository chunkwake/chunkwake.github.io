name: Check site

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'content/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/**'
      - 'next.config.mjs'
      - 'source.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'postcss.config.mjs'
      - 'tsconfig.json'

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm types:check

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
