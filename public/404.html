<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Chunkwake</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html { background: #181818; color: #e7e7e7; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 24px; }
      main { width: 100%; max-width: 560px; }
      .code { font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #a6a092; text-transform: uppercase; }
      h1 { margin: 8px 0 0; font-size: 30px; letter-spacing: -0.03em; font-weight: 600; }
      p { margin: 10px 0 0; color: #9a9a96; font-size: 14px; line-height: 1.6; }
      .actions { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
      a { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid #303030; background: #202020; color: #e7e7e7; text-decoration: none; font-size: 13px; }
      a.primary { background: #a6a092; border-color: #a6a092; color: #181818; font-weight: 500; }
      .mono { font-family: ui-monospace, monospace; font-size: 10.5px; color: #7a7a75; margin-top: 22px; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404 · not found</div>
      <h1>Страница не найдена</h1>
      <p>Возможно, она переехала. Начни с документации или вернись на главную.</p>
      <div class="actions">
        <a class="primary" href="/ru/docs/">Документация</a>
        <a href="/ru/">На главную</a>
        <a href="/en/">English</a>
      </div>
      <div class="mono">chunkwake · minecraft 26.3 · rust</div>
    </main>
  </body>
</html>
